[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "train-kokoro-encoder-styletts2"
version = "0.1.0"
description = "An experimental attempt to train missing Kokoro TTS encoders using StyleTTS2"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name="Gushilabs Open Source" },
]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Audio :: Speech"
]
requires-python = ">=3.10, <3.14"
dependencies = [
    "huggingface_hub",
    "loguru",
    "misaki[en]>=0.9.4",
    "numpy",
    "torch",
    "transformers"
]

[project.scripts]
kokoro = "kokoro.__main__:main"

[tool.hatch.build.targets.wheel]
only-include = ["kokoro/kokoro"]
sources = ["kokoro"]
only-packages = true

[project.urls]
Homepage = "https://github.com/gushilabs/train-kokoro-encoder-styletts2"
Repository = "https://github.com/gushilabs/train-kokoro-encoder-styletts2"
Upstream-Decoder = "https://github.com/hexgrad/kokoro"
Upstream-Patch = "https://github.com/semidark/kokoro-deutsch"